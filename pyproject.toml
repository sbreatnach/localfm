[project]
name = "localfm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django>=5.2.8,<7",
    "django-ninja>=1.5.0,<2",
    "psycopg>=3.3.1,<4",
    "pylast>=7.0.0,<8",
    "python-dateutil>=2.9.0.post0,<4",
    "tinytag>=2.2.0,<3",
    "waitress>=3.0.2,<4",
    "watchdog>=6.0.0,<8",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "eyed3>=0.9.9",
    "httpx>=0.28.0",
    "isort>=7.0.0",
    "pydub>=0.25.1",
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "ruff>=0.14.7",
]

[tool.pytest]
DJANGO_SETTINGS_MODULE = "localfm.settings"
pythonpath = ["."]
django_find_project = false
markers = [
    "blackbox: marks tests as blackbox tests",
]
